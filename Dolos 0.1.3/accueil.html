<!DOCTYPE html>
<!-- Le jeu de l'imposteur — galerie d'accueil — v0.2.0 -->
<!-- Les cartes sont injectées par app.py à l'emplacement <!--CARDS--> -->
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Salle de jeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15141d; --ink-2:#1e1c2b; --line:#322f44;
    --coral:#e2553c; --teal:#5fa195; --gold:#d8a93f; --mute:#8b88a3;
    --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #221f33 0%, transparent 60%),
      var(--ink);
    color:#ece9f5; font-family:Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top) 18px calc(24px + env(safe-area-inset-bottom));
  }
  header{text-align:center;margin:40px 0 28px}
  .eyebrow{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:600}
  h1{font-family:Fraunces,serif;font-weight:900;font-size:clamp(2.1rem,8vw,3.1rem);line-height:1;margin:.18em 0 0;letter-spacing:-.01em}
  h1 em{font-style:italic;color:var(--coral)}

  .gallery{width:100%;max-width:560px;flex:1;display:grid;gap:16px;align-content:start}

  .game{
    display:block;text-decoration:none;color:inherit;
    background:var(--ink-2);border:1px solid var(--line);border-radius:18px;
    padding:22px 22px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    transition:transform .15s,border-color .15s,filter .15s;
  }
  .game::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--mute)}
  .game.accent-coral::before{background:var(--coral)}
  .game.accent-teal::before{background:var(--teal)}
  .game.accent-gold::before{background:var(--gold)}
  a.game:hover{transform:translateY(-2px);border-color:var(--gold);filter:brightness(1.04)}

  .game-eyebrow{font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;font-weight:600;color:var(--mute)}
  .game.accent-coral .game-eyebrow{color:var(--coral)}
  .game.accent-teal .game-eyebrow{color:var(--teal)}
  .game h2{font-family:Fraunces,serif;font-weight:900;font-size:1.7rem;line-height:1;margin:.35em 0 .4em}
  .game p{color:var(--mute);font-size:.95rem;line-height:1.55;margin:0}

  .game-foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
  .tag{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
    border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .cta{font-weight:600;color:var(--coral)}

  .game.soon{opacity:.62;cursor:default}
  .game.soon::before{opacity:.5}

  footer{color:var(--mute);font-size:.74rem;margin-top:28px;text-align:center;opacity:.7}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <header>
    <div class="eyebrow">Entre amis, à distance</div>
    <h1>La salle de <em>jeux</em></h1>
  </header>
  <main class="gallery">
<!--CARDS-->
  </main>
  <footer>Choisis un jeu pour commencer. · v0.2.0</footer>
</body>
</html>
